name: Yash Arora — Daily Autonomous Outreach

on:
  schedule:
    # 14:50 UTC = 8:20 PM IST (daily, all 7 days)
    - cron: '50 14 * * *'
  workflow_dispatch: # Manual 1-click run from GitHub

jobs:
  outreach-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6-hour safety net

    permissions:
      contents: write  # Commit updated database & logs back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Autonomous Outreach Pipeline
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python autonomous_5hr_pipeline.py

      - name: Commit Updated Database & Logs
        if: always()
        run: |
          git config --global user.name "Outreach Bot"
          git config --global user.email "bot@yasharora.dev"
          git add leads_database.json do_not_contact.json sent_emails_log.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: daily cycle $(date -u +%Y-%m-%d) [skip ci]" && git push)
