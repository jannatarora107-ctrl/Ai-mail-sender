name: 24-7 Autonomous Outreach Scheduler

on:
  schedule:
    # 14:00 UTC = 7:30 PM IST = 9:00 AM Central Time (Monday to Friday)
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub website

jobs:
  run-outreach:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows committing updated database and logs back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Daily Outreach Pipeline
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python daily_pipeline.py --send

      - name: Commit and Push Updated Leads Database & Logs
        run: |
          git config --global user.name "Outreach Bot"
          git config --global user.email "bot@yasharora.com"
          git add leads_database.json sent_emails_log.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Logged outreach dispatch [skip ci]" && git push)
